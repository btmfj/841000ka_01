<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>イチゴ選別システム V1.68</title>
    <style>
        /* デザインはV1.50/1.66を継承 */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #ffe4e1; font-family: sans-serif; position: fixed; width: 100%; }
        #app-container { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 5px; box-sizing: border-box; width: 100%; }
        #weight-section { text-align: center; margin: 0; flex-shrink: 0; }
        #weight { font-size: 7vh; font-weight: bold; color: #00b300; line-height: 1; }
        #weight span { font-size: 2.5vh; color: #000; }
        #diff-display { font-size: 3vh; color: #ff4757; font-weight: bold; height: 3.5vh; }
        
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; display: none; box-sizing: border-box; flex-direction: column; }
        #flash-text-cell { height: 25%; display: flex; justify-content: center; align-items: center; }
        #flash-text { font-size: 12vh; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #000; }
        #flash-img-container { height: 75%; width: 95%; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 5px; }
        .flash-img-item { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.3); }

        .btn-container { width: 100%; max-width: 400px; margin-top: auto; padding-bottom: 5px; }
        .my-button { width: 100%; height: 45px; font-size: 16px; font-weight: bold; border-radius: 10px; border: none; color: white; margin: 2px 0; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 600; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .share-card { background: #fef2f2; border: 2px solid #ef4444; border-radius: 15px; padding: 15px; margin-top: 20px; text-align: center; }
        #v-canvas { width: 100%; max-width: 280px; display: none; margin: 10px auto; border: 4px solid #ef4444; border-radius: 10px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ef4444; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="weight-section">
            <div id="app-title" style="font-size:14px; font-weight:bold; color:#d63031;">はよ選果 V1.68</div>
            <div id="status" style="font-size:10px; color:#555;">Bluetooth未接続</div>
            <div id="weight">0.0<span>g</span></div>
            <div id="diff-display">--.- g 減</div>
        </div>
        
        <div id="flash-overlay">
            <div id="flash-text-cell"><div id="flash-text"></div></div>
            <div id="flash-img-container"></div>
        </div>

        <div class="btn-container">
            <button id="connectBtn" class="my-button" style="background:#28a745;">① 接続・開始</button>
            <button id="tareBtn" class="my-button" style="background:#ff8c00;">② 基準リセット</button>
            <div style="display: flex; gap: 8px; margin: 3px 0;">
                <button id="modePre" class="mode-btn active" style="flex:1; height:35px; border-radius:8px; border:2px solid #d63031; font-weight:bold; background:#d63031; color:#fff;">事前選果</button>
                <button id="modeDirect" class="mode-btn" style="flex:1; height:35px; border-radius:8px; border:2px solid #d63031; font-weight:bold; background:#fff; color:#d63031;">直パック</button>
            </div>
            <button id="settingsBtn" class="my-button" style="background: #6c757d; height: 35px; font-size: 13px;">🛠 設定・クラウド同期</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        const STORAGE_KEY = 'strawberry_config_v106'; 
        let currentRanges = [], currentMode = "pre", sounds = {};

        function loadSettings() {
            const saved = localStorage.getItem(STORAGE_KEY);
            currentRanges = saved ? JSON.parse(saved) : [{ min: 17.8, label: "2L", audio: "2LD", images: [null, null, null, null] }];
        }
        window.onload = loadSettings;

        // --- 匿名クラウド同期：送信（トークン不要） ---
        async function uploadAnonymously() {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            
            try {
                // 登録不要の無料ストレージサービスを利用
                const res = await fetch('https://api.myjson.online/v1/records', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ data: currentRanges })
                });
                const result = await res.json();
                
                if(result.id) {
                    const qrArea = document.getElementById('qrcode');
                    qrArea.innerHTML = '';
                    // IDだけをQRにする（短いので読み取りやすい）
                    new QRCode(qrArea, { text: result.id, width: 180, height: 180 });
                    document.getElementById('sync-msg').innerText = "✅ クラウドに保管しました";
                }
            } catch (e) {
                alert("送信に失敗しました。ネット接続を確認してください。");
            } finally { loader.style.display = 'none'; }
        }

        // --- 匿名クラウド同期：受信（QRスキャン） ---
        async function scanAndDownload() {
            const video = document.createElement("video");
            const canvas = document.getElementById("v-canvas");
            const ctx = canvas.getContext("2d");
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream; video.play(); canvas.style.display = "block";

            const tick = async () => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                    if (code) {
                        stream.getTracks().forEach(t => t.stop());
                        canvas.style.display = "none";
                        // IDを使ってクラウドから取得
                        const res = await fetch(`https://api.myjson.online/v1/records/${code.data}`);
                        const result = await res.json();
                        if(confirm("設定を受信しました。上書きしますか？")) {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(result.data));
                            location.reload();
                        }
                        return;
                    }
                }
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        // --- 以下、秤・Bluetooth・設定画面のロジック ---
        // (V1.50/V1.66と同じものを流用。スペースの関係で主要部のみ)
        document.getElementById('settingsBtn').onclick = () => { document.getElementById('settings-modal').style.display = 'block'; };
        // ... 他の関数は適宜以前のコードを統合 ...
    </script>

    <div id="settings-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center;"><b>設定・同期</b><button onclick="document.getElementById('settings-modal').style.display='none'">✕</button></div>
        
        <div class="share-card">
            <h3 style="font-size:15px; margin:0; color:#b91c1c;">🍓 かんたんクラウド同期</h3>
            <p style="font-size:10px; color:#ef4444; margin-bottom:10px;">パスワード不要・ルーター制限なし</p>
            
            <button class="my-button" style="background:#ef4444;" onclick="uploadAnonymously()">1. クラウドへ送り、QRを作る</button>
            <div id="loader" class="loader"></div>
            <div id="qrcode" style="margin:10px auto; display:flex; justify-content:center;"></div>
            <p id="sync-msg" style="font-size:11px; font-weight:bold; color:#ef4444;"></p>
            
            <div style="margin:15px 0; border-top:1px dashed #ef4444;"></div>
            
            <button class="my-button" style="background:#10b981;" onclick="scanAndDownload()">2. QRを読んで同期する</button>
            <canvas id="v-canvas"></canvas>
        </div>
    </div>
</body>
</html>
