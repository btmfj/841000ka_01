<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>イチゴ選別システム V1.95</title>
    <style>
        /* スタイルは以前のものを継承 */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #ffe4e1; font-family: sans-serif; position: fixed; width: 100%; }
        #app-container { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 5px; box-sizing: border-box; width: 100%; }
        #app-title { font-size: 14px; font-weight: bold; color: #d63031; margin: 0; }
        #weight { font-size: 7vh; font-weight: bold; color: #00b300; line-height: 1; margin: 2px 0; }
        #weight span { font-size: 2.5vh; color: #000; }
        
        .btn-container { width: 100%; max-width: 400px; margin-top: auto; padding-bottom: 5px; }
        .my-button { width: 100%; height: 45px; font-size: 16px; font-weight: bold; border-radius: 10px; border: none; color: white; margin: 2px 0; cursor: pointer; }
        #connectBtn { background-color: #28a745; box-shadow: 0 3px #1e7e34; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 600; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .config-row { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .share-card { background: #f0fdf4; border: 2px solid #10b981; border-radius: 15px; padding: 15px; margin-top: 20px; text-align: center; }
        #qrcode { margin: 10px auto; display: flex; justify-content: center; background: white; padding: 10px; min-height: 160px; }
        #v-canvas { width: 100%; max-width: 280px; display: none; margin: 10px auto; border: 4px solid #10b981; border-radius: 10px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #10b981; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="app-title">はよ選果 V1.95</div>
        <div id="weight">0.0<span>g</span></div>
        <div class="btn-container">
            <button id="connectBtn" class="my-button">① 接続・開始</button>
            <button id="settingsBtn" class="my-button" style="background: #6c757d; height: 35px; font-size: 13px;">🛠 設定・画像同期</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        const STORAGE_KEY = 'strawberry_config_v106';
        // ここにGASのURLを貼り付けてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw--AdGtMrbD8KkYqYiwSnFj9JnljY-UJ_vrwyhh43Mt_mnBwrULIIoF_LO1VkOkWz8/exec";
        let currentRanges = [];

        // 1. 親機：画像も含めてGASに投稿する (掲示板への書き込み)
        function syncToGas() {
            if (!GAS_URL.includes("/exec")) return alert("GASのURLを設定してください");
            
            const loader = document.getElementById('loader'), msg = document.getElementById('sync-msg'), qrDiv = document.getElementById('qrcode');
            loader.style.display = 'block'; msg.innerText = "画像データをクラウドへ送信中..."; qrDiv.innerHTML = '';

            const xhr = new XMLHttpRequest();
            xhr.open("POST", GAS_URL, true);
            // 匿名アクセスを許可するためのヘッダー（GAS側doPostに対応）
            xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");

            xhr.onload = function() {
                loader.style.display = 'none';
                if (xhr.status >= 200 && xhr.status < 400) {
                    try {
                        const result = JSON.parse(xhr.responseText);
                        if (result.id) {
                            // IDだけをQRコードにする（データ本体はGASにある）
                            new QRCode(qrDiv, { text: result.id, width: 160, height: 160 });
                            msg.style.color = "#22c55e"; msg.innerText = "✅ 同期QRを発行しました！";
                        }
                    } catch(e) { msg.innerText = "❌ 応答解析エラー"; }
                } else { msg.innerText = "❌ 送信失敗 (" + xhr.status + ")"; }
            };

            xhr.onerror = function() {
                loader.style.display = 'none';
                msg.style.color = "#ef4444";
                msg.innerText = "❌ 通信が遮断されました (GASの設定を確認)";
            };

            // 画像を含む全データを送信
            xhr.send(JSON.stringify(currentRanges));
        }

        // 2. 子機：QRコードをスキャンしてIDを取得し、GASから全データをダウンロード (掲示板の読み込み)
        async function scanGasQR() {
            try {
                const video = document.createElement("video"), canvas = document.getElementById("v-canvas"), ctx = canvas.getContext("2d");
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream; video.setAttribute("playsinline", true); video.play();
                canvas.style.display = "block";
                
                const tick = async () => {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                        
                        if (code && code.data.length > 30) { // UUID形式っぽければ
                            stream.getTracks().forEach(t => t.stop());
                            canvas.style.display = "none";
                            
                            // GASから画像を含むデータをダウンロード
                            fetch(`${GAS_URL}?id=${code.data}`)
                                .then(res => res.json())
                                .then(data => {
                                    if (data && data.length > 0 && confirm("画像を含む設定を同期しますか？")) {
                                        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                                        location.reload();
                                    }
                                }).catch(e => alert("データの取得に失敗しました"));
                            return; 
                        }
                    }
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            } catch (err) { alert("カメラ起動に失敗しました"); }
        }

        /* 以下、設定画面表示ロジック等は必要に応じて統合 */
        document.getElementById('settingsBtn').onclick = () => {
            currentRanges = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            // 設定モーダルを表示する処理（省略）
            document.getElementById('settings-modal').style.display = 'block';
        };
    </script>

    <div id="settings-modal" class="modal">
        <b>画像同期 (V1.95)</b>
        <div class="share-card">
            <h3>☁️ 画像も含めてクラウド同期</h3>
            <p style="font-size:10px;">トークン不要。誰でも読み書きできる掲示板方式です。</p>
            <button onclick="syncToGas()" style="width:100%; padding:10px; background:#10b981; color:white; border:none; border-radius:5px; font-weight:bold;">1. 親機：画像を送信</button>
            <div id="loader" class="loader"></div>
            <div id="qrcode"></div>
            <p id="sync-msg" style="font-size:11px;"></p>
            <hr>
            <button onclick="scanGasQR()" style="width:100%; padding:10px; background:#3b82f6; color:white; border:none; border-radius:5px; font-weight:bold;">2. 子機：画像を読込</button>
            <canvas id="v-canvas"></canvas>
        </div>
        <button onclick="document.getElementById('settings-modal').style.display='none'" style="margin-top:20px; width:100%;">閉じる</button>
    </div>
</body>
</html>
