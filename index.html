<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>イチゴ選別システム V1.63</title>
    <style>
        /* デザインは前バージョンを継承 */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #ffe4e1; font-family: sans-serif; position: fixed; width: 100%; }
        #app-container { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 5px; box-sizing: border-box; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 600; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .share-card { background: #f8f9fa; border: 2px solid #333; border-radius: 15px; padding: 15px; margin-top: 15px; text-align: center; }
        #qrcode-gist { display: flex; justify-content: center; margin: 10px 0; }
        .api-input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-container">
        <h2 id="app-title">はよ選果 V1.63</h2>
        <button onclick="document.getElementById('settings-modal').style.display='block'" class="my-button" style="background:#6c757d;">🛠 設定・自動同期</button>
    </div>

    <div id="settings-modal" class="modal">
        <div style="display:flex; justify-content:space-between;"><b>自動クラウド同期設定</b><button onclick="document.getElementById('settings-modal').style.display='none'">✕</button></div>
        
        <div class="share-card">
            <h3 style="font-size:14px; margin:0;">🚀 GitHub API 自動連携</h3>
            <p style="font-size:10px; color:#666;">初回のみ：GitHubのTokenを入力してください</p>
            <input type="password" id="gh-token" class="api-input" placeholder="GitHub Personal Access Token">
            
            <button onclick="uploadToGist()" style="background:#333; color:white; width:100%; padding:12px; border-radius:10px; border:none; font-weight:bold; margin-top:10px;">
                1. 設定をクラウドへ飛ばす
            </button>
            <div id="loader" class="loader"></div>
            <div id="qrcode-gist"></div>
            <p id="gist-status" style="font-size:10px; color:#28a745;"></p>

            <div style="border-top:1px dashed #ccc; margin:15px 0;"></div>
            
            <button onclick="startGistScan()" style="background:#28a745; color:white; width:100%; padding:12px; border-radius:10px; border:none; font-weight:bold;">
                2. 子機でスキャンして同期
            </button>
        </div>
        <canvas id="v-canvas" style="display:none; width:100%; margin-top:10px;"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        const STORAGE_KEY = 'strawberry_config_v106';
        const TOKEN_KEY = 'gh_token_v1';

        // 起動時に保存されたTokenを復元
        window.onload = () => {
            const savedToken = localStorage.getItem(TOKEN_KEY);
            if(savedToken) document.getElementById('gh-token').value = savedToken;
        };

        // --- GitHub Gistへ自動アップロード ---
        async function uploadToGist() {
            const token = document.getElementById('gh-token').value;
            if(!token) return alert("GitHubのTokenを入力してください");
            localStorage.setItem(TOKEN_KEY, token); // 次回のために保存

            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            const configData = localStorage.getItem(STORAGE_KEY) || "[]";
            
            const payload = {
                description: "Strawberry Sorting Config",
                public: false, // 秘密のGistとして作成
                files: {
                    "config.json": { content: configData }
                }
            };

            try {
                const response = await fetch("https://api.github.com/gists", {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if(result.id) {
                    const rawUrl = result.files["config.json"].raw_url;
                    // QRコード生成
                    const qrDiv = document.getElementById('qrcode-gist');
                    qrDiv.innerHTML = '';
                    new QRCode(qrDiv, { text: rawUrl, width: 200, height: 200 });
                    document.getElementById('gist-status').innerText = "クラウド保存成功！QRをスキャンしてください";
                } else {
                    throw new Error("アップロード失敗");
                }
            } catch (e) {
                alert("エラー: Tokenが正しいか、通信環境を確認してください");
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- 子機：スキャンして自動ダウンロード ---
        async function startGistScan() {
            const video = document.createElement("video");
            const canvas = document.getElementById("v-canvas");
            const ctx = canvas.getContext("2d");
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream; video.play(); canvas.style.display = "block";

            const tick = async () => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                    if (code) {
                        stream.getTracks().forEach(t => t.stop());
                        canvas.style.display = "none";
                        
                        // QRの中身（Raw URL）からデータを取得
                        try {
                            const res = await fetch(code.data);
                            const data = await res.json();
                            if(confirm("最新マスタをダウンロードしました。上書きしますか？")) {
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                                alert("同期完了！再読み込みします");
                                location.reload();
                            }
                        } catch(e) { alert("取得失敗"); }
                        return;
                    }
                }
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
