<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>イチゴ選別システム V2.03</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #ffe4e1; font-family: sans-serif; position: fixed; width: 100%; }
        #app-container { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; width: 100%; }
        #weight-section { text-align: center; margin: 0; flex-shrink: 0; width: 100%; }
        #app-title { font-size: 24px; font-weight: bold; color: #d63031; margin-bottom: 5px; }
        #status { color: #555; font-size: 14px; margin-bottom: 5px; }
        #weight { font-size: 10vh; font-weight: bold; color: #00b300; line-height: 1; margin: 5px 0; }
        #weight span { font-size: 4vh; color: #000; margin-left: 5px; }
        #diff-display { font-size: 4vh; color: #ff4757; height: 4vh; font-weight: bold; margin-bottom: 10px; }
        
        /* --- 判定オーバーレイ（ここを大幅強化） --- */
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; display: none; box-sizing: border-box; flex-direction: column; justify-content: flex-start; align-items: center; overflow: hidden; padding: 10px; }
        #flash-text-cell { width: 100%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; overflow: hidden; white-space: nowrap; margin-bottom: 10px; }
        #flash-text { font-weight: bold; color: #fff; text-align: center; width: 100%; line-height: 1.1; }
        #flash-img-cell { width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #flash-img-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; }
        #flash-img-container.grid-layout { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; width: 100%; height: 100%; }
        #flash-img-container.grid-layout div { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; overflow: hidden; }
        .flash-img-item { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; }

        /* --- UIパーツ（以前のスタイルを完全維持） --- */
        .btn-container { width: 100%; max-width: 500px; margin-top: auto; padding-bottom: 15px; flex-shrink: 0; }
        .my-button { width: 100%; height: 60px; font-size: 20px; font-weight: bold; border-radius: 15px; border: none; color: white; margin: 5px 0; cursor: pointer; }
        #connectBtn { background-color: #28a745; box-shadow: 0 4px #1e7e34; }
        #tareBtn { background-color: #ff8c00; box-shadow: 0 4px #d97700; }
        .mode-row { display: flex; gap: 10px; margin: 5px 0; }
        .mode-btn { flex: 1; height: 50px; border-radius: 12px; border: 3px solid #d63031; background: #fff; color: #d63031; font-weight: bold; font-size: 16px; }
        .mode-btn.active { background: #d63031; color: #fff; }
        #settingsBtn { background: #6c757d; height: 45px; font-size: 14px; margin-top: 5px; }

        /* モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 600; overflow-y: auto; padding-top: 70px; }
        .modal-header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding: 0 15px; box-sizing: border-box; z-index: 700; }
        .config-row { border: 2px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 12px; background: #fafafa; }
        .input-group { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
        .image-slots { display: flex; gap: 10px; margin-top: 5px; }
        .slot { position: relative; width: 60px; height: 60px; border: 2px dashed #bbb; background: #eee; border-radius: 8px; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        .slot label { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 20px; color: #007bff; }
        .share-card { background: #f0fdf4; border: 3px solid #10b981; border-radius: 20px; padding: 15px; margin-top: 20px; text-align: center; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #10b981; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="weight-section">
            <div id="app-title">はよ選果 V2.03</div>
            <div id="status">Bluetooth未接続</div>
            <div id="weight">0.0<span>g</span></div>
            <div id="diff-display">--.- g 減</div>
        </div>

        <div id="flash-overlay">
            <div id="flash-text-cell"><div id="flash-text"></div></div>
            <div id="flash-img-cell"><div id="flash-img-container"></div></div>
        </div>

        <div class="btn-container">
            <button id="connectBtn" class="my-button">① 接続・開始</button>
            <button id="tareBtn" class="my-button">② 基準リセット</button>
            <div class="mode-row">
                <button id="modePre" class="mode-btn active">事前選果</button>
                <button id="modeDirect" class="mode-btn">直パック詰め</button>
            </div>
            <button id="settingsBtn" class="my-button">🛠 設定</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-header">
            <div class="modal-title">設定 (V2.03)</div>
            <div>
                <button style="background:#28a745; color:white; padding:10px 15px; border-radius:8px; border:none; font-weight:bold;" onclick="saveConfig()">保存</button>
                <button style="background:#ff4757; color:white; padding:10px 15px; border-radius:8px; border:none; font-weight:bold;" onclick="document.getElementById('settings-modal').style.display='none'">戻る</button>
            </div>
        </div>
        <div class="modal-content" style="padding:15px;">
            <div id="config-list"></div>
            <button onclick="addRangeRow()" style="width:100%; padding:15px; margin-top:10px; border-radius:12px; font-size:18px; font-weight:bold; background:#e0e0e0; border:none;">＋ 判定範囲を追加</button>
            
            <div class="share-card">
                <h3>設定の同期</h3>
                <button class="my-button" style="background:#10b981; height:50px;" onclick="syncToGas()">QRコードの作成</button>
                <div id="loader" class="loader"></div>
                <div id="qrcode" style="display:flex; justify-content:center; margin:10px;"></div>
                <p id="sync-msg" style="font-size:12px; color:#666;"></p>
                <button class="my-button" style="background:#3b82f6; height:50px;" onclick="scanGasQR()">カメラでQR読込</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        // --- 基本設定と復元 ---
        const STORAGE_KEY = 'strawberry_config_v203';
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzoXz3vQvQOg6TIR0cshy5N6ysqWC-AODRzlCmN2Cr-WPK3hgOr3zCVPZ_kMgNqYu_U/exec";
        
        let currentRanges = [], sounds = {}, currentMode = "pre";
        const colorPalette = { "赤": "#d63031", "紫": "#6c5ce7", "青": "#0984e3", "緑": "#00b894", "オレンジ": "#e67e22", "黒": "#000000" };

        function loadSettings() {
            const saved = localStorage.getItem(STORAGE_KEY);
            currentRanges = saved ? JSON.parse(saved) : [{ min: 17.8, label: "2L", audio: "2L", audioMode: "mp3", ttsText: "ニエル", ttsVoice: "female", ttsRate: 1.0, ttsPitch: 1.0, colorName: "青", images: [null, null, null, null] }];
            currentRanges.sort((a, b) => b.min - a.min);
            refreshSounds();
        }

        function refreshSounds() {
            sounds = {};
            currentRanges.forEach(r => {
                if ((!r.audioMode || r.audioMode === "mp3") && r.audio) {
                    const key = r.audio.toLowerCase();
                    sounds[key] = new Audio("./" + encodeURIComponent(key) + ".mp3");
                }
            });
            sounds["start"] = new Audio("./start.mp3");
        }

        function saveConfig() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentRanges));
            refreshSounds();
            alert('保存しました');
        }

        // --- 表示ロジック（不具合修正版） ---
        function triggerEffect(match, isPreview = false) {
            const overlay = document.getElementById('flash-overlay');
            overlay.style.zIndex = isPreview ? "800" : "500";
            
            showFlash(match.label, match.colorName || "黒", match.images || []);
            
            if (match.audioMode === "tts") {
                speak(match.ttsText || match.label, match.ttsVoice, match.ttsRate || 1.0, match.ttsPitch || 1.0);
            } else {
                const key = match.audio ? match.audio.toLowerCase() : "";
                if (sounds[key]) { sounds[key].currentTime = 0; sounds[key].play(); }
            }
        }

        function showFlash(text, colorName, imgArray) {
            const overlay = document.getElementById('flash-overlay');
            const fText = document.getElementById('flash-text');
            const imgCell = document.getElementById('flash-img-cell');
            const imgContainer = document.getElementById('flash-img-container');
            const activeImages = imgArray.filter(src => src !== null);
            
            overlay.style.backgroundColor = colorPalette[colorName] || "#000";
            fText.innerText = text;
            imgContainer.innerHTML = '';
            imgContainer.className = '';

            if (currentMode === "pre" || activeImages.length === 0) {
                imgCell.style.display = "none";
                adjustFontSize(fText, 70); 
            } else {
                imgCell.style.display = "flex";
                adjustFontSize(fText, 18); // 文字エリアを確保
                
                if (activeImages.length >= 3) {
                    imgContainer.classList.add('grid-layout');
                    activeImages.slice(0, 4).forEach(src => {
                        const div = document.createElement('div');
                        const img = document.createElement('img');
                        img.src = src; img.className = 'flash-img-item';
                        div.appendChild(img); imgContainer.appendChild(div);
                    });
                } else {
                    activeImages.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src; img.className = 'flash-img-item';
                        if(activeImages.length === 2) img.style.maxWidth = "48%";
                        imgContainer.appendChild(img);
                    });
                }
            }
            overlay.style.display = 'flex';
            if (window.flashTimer) clearTimeout(window.flashTimer);
            window.flashTimer = setTimeout(() => { overlay.style.display = 'none'; }, currentMode === "pre" ? 1200 : 3500);
        }

        function adjustFontSize(el, maxVh) {
            const parent = el.parentElement;
            let size = maxVh;
            el.style.fontSize = size + "vh";
            // 1行に収まるまで1vhずつ下げる
            while ((el.offsetWidth > parent.clientWidth * 0.95 || el.offsetHeight > parent.clientHeight) && size > 2) {
                size -= 1;
                el.style.fontSize = size + "vh";
            }
        }

        // --- Bluetooth & 計測（全復元） ---
        let bluetoothChar = null, stableWeight = 0, weightHistory = [];
        document.getElementById('connectBtn').onclick = async () => {
            if ('wakeLock' in navigator) { try { await navigator.wakeLock.request('screen'); } catch(e){} }
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'はよ選果' }], optionalServices: [SERVICE_UUID] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothChar = await service.getCharacteristic(CHARACTERISTIC_UUID);
                await bluetoothChar.startNotifications();
                document.getElementById('status').innerText = "✅ 接続中";
                if(sounds["start"]) sounds["start"].play();
                bluetoothChar.addEventListener('characteristicvaluechanged', (e) => {
                    const val = new TextDecoder().decode(e.target.value);
                    const w = parseFloat(val);
                    if (isNaN(w)) return;
                    document.getElementById('weight').innerHTML = `${w.toFixed(1)}<span>g</span>`;
                    
                    weightHistory.push(w);
                    if (weightHistory.length > 3) weightHistory.shift();
                    if (weightHistory.length === 3 && Math.max(...weightHistory) - Math.min(...weightHistory) < 0.2) {
                        if (Math.abs(stableWeight - w) > 0.5) {
                            if (stableWeight > w) {
                                const diff = stableWeight - w;
                                if (diff >= 5.0) {
                                    document.getElementById('diff-display').innerText = diff.toFixed(1) + " g 減";
                                    const match = currentRanges.find(r => diff >= r.min);
                                    if (match) triggerEffect(match);
                                }
                            }
                            stableWeight = w;
                        }
                    }
                });
            } catch (err) { alert("Bluetooth接続失敗: " + err); }
        };

        // --- GAS同期ロジック（全復元） ---
        async function syncToGas() {
            const loader = document.getElementById('loader');
            const qrcodeDiv = document.getElementById('qrcode');
            loader.style.display = 'block'; qrcodeDiv.innerHTML = '';
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'upload', data: currentRanges }) });
                const json = await res.json();
                if (json.id) {
                    new QRCode(qrcodeDiv, { text: json.id, width: 180, height: 180 });
                    document.getElementById('sync-msg').innerText = "このQRを他端末で読み取ってください";
                }
            } catch (e) { alert("同期失敗"); }
            loader.style.display = 'none';
        }

        async function scanGasQR() {
            const video = document.createElement('video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream; video.play();
            const scan = () => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                    if (code) {
                        stream.getTracks().forEach(track => track.stop());
                        fetch(`${GAS_URL}?id=${code.data}`).then(r => r.json()).then(data => {
                            if(data && Array.isArray(data)){ currentRanges = data; saveConfig(); renderConfigList(); alert("設定を同期しました"); }
                        });
                        return;
                    }
                } requestAnimationFrame(scan);
            };
            requestAnimationFrame(scan);
        }

        // --- 設定画面のレンダリング ---
        function renderConfigList() {
            const area = document.getElementById('config-list'); area.innerHTML = '';
            currentRanges.forEach((r, i) => {
                const div = document.createElement('div'); div.className = 'config-row';
                let slots = '';
                for(let j=0; j<4; j++){
                    const img = r.images[j];
                    slots += `<div class="slot">${img?`<img src="${img}"><button style="position:absolute;top:-5px;right:-5px;background:red;color:white;border:none;border-radius:50%;width:20px;height:20px;" onclick="currentRanges[${i}].images[${j}]=null;renderConfigList()">×</button>`:`<label>＋<input type="file" style="display:none" onchange="addImg(event,${i},${j})"></label>`}</div>`;
                }
                div.innerHTML = `
                    <div class="input-group">規格名：<input type="text" value="${r.label}" oninput="currentRanges[${i}].label=this.value"></div>
                    <div class="input-group">重さ：<input type="number" step="0.1" value="${r.min}" oninput="currentRanges[${i}].min=parseFloat(this.value)">g〜</div>
                    <div class="input-group">音声：<input type="text" value="${r.audio||''}" oninput="currentRanges[${i}].audio=this.value">.mp3</div>
                    <div class="image-slots">${slots}</div>
                    <div style="margin-top:10px; display:flex; gap:10px;">
                        <button style="flex:1; background:#ff4757; color:white; border:none; padding:10px; border-radius:5px;" onclick="currentRanges.splice(${i},1);renderConfigList()">削除</button>
                        <button style="flex:1; background:#28a745; color:white; border:none; padding:10px; border-radius:5px;" onclick="triggerEffect(currentRanges[${i}], true)">プレビュー</button>
                    </div>`;
                area.appendChild(div);
            });
        }

        // 共通関数
        function addRangeRow() { currentRanges.push({min:0,label:'新規格',audio:'',audioMode:'mp3',colorName:'黒',images:[null,null,null,null]}); renderConfigList(); }
        function addImg(e, i, sIdx) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader(); reader.onload = (f) => {
                const img = new Image(); img.src = f.target.result;
                img.onload = () => {
                    const cvs = document.createElement('canvas'), maxSide = 600;
                    const sc = Math.min(maxSide/img.width, maxSide/img.height, 1.0);
                    cvs.width = img.width * sc; cvs.height = img.height * sc;
                    cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
                    currentRanges[i].images[sIdx] = cvs.toDataURL('image/jpeg', 0.85); renderConfigList();
                };
            }; reader.readAsDataURL(file);
        }
        function speak(t,g,r,p){ window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate=r; u.pitch=p; window.speechSynthesis.speak(u); }
        
        document.getElementById('settingsBtn').onclick = () => { renderConfigList(); document.getElementById('settings-modal').style.display = 'block'; };
        document.getElementById('modePre').onclick = () => { currentMode="pre"; document.getElementById('modePre').classList.add('active'); document.getElementById('modeDirect').classList.remove('active'); };
        document.getElementById('modeDirect').onclick = () => { currentMode="direct"; document.getElementById('modeDirect').classList.add('active'); document.getElementById('modePre').classList.remove('active'); };
        document.getElementById('tareBtn').onclick = () => { if(bluetoothChar) bluetoothChar.writeValue(new TextEncoder().encode('1')); };
        
        window.onload = loadSettings;
    </script>
</body>
</html>
